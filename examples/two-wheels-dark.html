<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <title>Two Weels</title>
    <link rel="stylesheet" href="./index.css" />
    <style>
      body {
        flex-direction: row;
        gap: 2rem;
        color-scheme: dark;
      }
    </style>
  </head>
  <body>
    <ryb-color-picker
      id="picker1"
      initialValue="hotpink"
      showSettings
    ></ryb-color-picker>
    <ryb-color-picker
      id="picker2"
      initialValue="hotpink"
      showSettings
    ></ryb-color-picker>

    <script type="module">
      import { cubes } from 'rybitten/cubes';

      import '../src/main.js';

      const picker1El = document.getElementById('picker1');
      const picker2El = document.getElementById('picker2');

      if (!picker1El.gamutPresets.length) {
        const presets = Array.from(cubes, ([id, d]) => [
          id,
          d.title,
          d.cube,
        ]).filter((d, i) => i % 2 === 0);

        picker1El.loadGamutPresets(presets, 'itten');
      }

      if (!picker2El.gamutPresets.length) {
        const presets = Array.from(cubes, ([id, d]) => [
          id,
          d.title,
          d.cube,
        ]).filter((d, i) => i % 2 === 1);

        picker2El.loadGamutPresets(presets, 'munsell');
      }
    </script>
  </body>
</html>
