<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <title>Full Size</title>
    <style>
      body {
        background: #fafafa;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        flex-direction: column;
      }
    </style>
  </head>
  <body>
    <ryb-color-swatch id="swatch"></ryb-color-swatch>
    <ryb-color-picker
      id="picker"
      diameter="420"
      distortion="8"
      initialvalue="hotpink"
      nostore
      segmentshue="128"
      segmentslightness="128"
      segmentssaturation="128"
      thicknesshue="40"
      thicknesslightness="28"
      thicknesssaturation="28"
    ></ryb-color-picker>

    <script type="module">
      import { cubes } from '../src/main.js';

      const swatchEl = document.getElementById('swatch');
      const pickerEl = document.getElementById('picker');

      swatchEl.addEventListener('click', (event) => {
        pickerEl.show = !pickerEl.show;
      });

      pickerEl.addEventListener('update:value', (event) => {
        swatchEl.value = event.detail.value;
      });
    </script>
  </body>
</html>
